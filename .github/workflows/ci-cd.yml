name: Build and Deploy to Azure AKS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          PYTHONPATH=. python -m pytest -q

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cicd-demo:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/cicd-demo:latest

  deploy-to-aks:
    needs: build-test-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out Kubernetes manifests
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.2.22'

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AZURE_AKS_CLUSTER_NAME }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Update Kubernetes image
        run: |
          sed -i "s#IMAGE_NAME_PLACEHOLDER#ghcr.io/${{ github.repository_owner }}/cicd-demo:${{ github.sha }}#g" k8s/deployment.yaml
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -k k8s/
          kubectl rollout status deployment/cicd-demo -n cicd-demo --timeout=180s
          kubectl get pods -n cicd-demo
          kubectl get svc -n cicd-demo
          ENDPOINT=$(kubectl get service cicd-demo -n cicd-demo -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -z "$ENDPOINT" ]; then
            ENDPOINT=$(kubectl get service cicd-demo -n cicd-demo -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          fi
          echo "Application endpoint: http://$ENDPOINT"
          curl --fail --retry 20 --retry-delay 10 "http://$ENDPOINT/health"
